name: T-1 — Full stack verification

# Manual trigger (Actions tab -> "T-1 — Full stack verification" -> "Run workflow"),
# plus automatic runs on push/PR so this doesn't silently rot.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    # Explicit, not implied: GitHub's default (unspecified) shell selection
    # does NOT apply `-o pipefail` (confirmed against actions/runner-images#4459
    # and GitHub's own corrected docs — a piped command's exit status is the
    # last command in the pipe, e.g. `cmd | tee file` reports tee's exit code,
    # not cmd's, which would let a real test failure show green). Setting
    # `shell: bash` here applies `-eo pipefail` to every run step below.
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # Job 1 — real pip install + the full test suite, including the two
  # suites that only skip because fastapi/sqlalchemy aren't installed
  # (tests/test_api_security.py, tests/test_vapi_api.py). WBS-1.1 / 1.2.
  # ---------------------------------------------------------------------
  install-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm the previously-blocked stack actually imports
        # Uses importlib.metadata rather than each package's own __version__
        # attribute: stripe-python's own changelog (PR #1645, "lazily
        # initialize subservices ... add module-level __getattr__ functions
        # to most __init__.py files") means a bare `stripe.__version__` isn't
        # guaranteed to resolve the same way release to release. Reading the
        # installed distribution's metadata is stable regardless of what the
        # package internally exposes, and still proves the import succeeded.
        # `httpx` added 2026-09-09 (T-5) — ResendEmailProvider/
        # TwilioSmsProvider both lazily import it the same way
        # StripePaymentProvider lazily imports `stripe`.
        run: |
          python3 -c "
          import importlib.metadata as m
          for pkg in ['fastapi', 'sqlalchemy', 'pydantic', 'stripe', 'httpx']:
              __import__(pkg)
              print(f'{pkg} imports OK — installed version: {m.version(pkg)}')
          "

      - name: Run full test suite (dependency-free + the two HTTP suites)
        # Deliberately NOT gated on this step's own exit code: unittest's
        # own summary line is parsed deterministically in the next step
        # instead (see that step's comment for why). `|| true` plus a plain
        # redirect (not a pipe) means this step's result never depends on
        # shell pipefail semantics either way.
        run: |
          python3 -m unittest \
            tests.test_core_logic \
            tests.test_security_core \
            tests.test_vapi_core \
            tests.test_payments_core \
            tests.test_api_security \
            tests.test_vapi_api \
            tests.test_notifications_core \
            -v > /tmp/test_output.log 2>&1 || true
          cat /tmp/test_output.log

      - name: Deterministically verify test count, zero skips, and a clean OK
        # Stronger than grepping for one known skip-reason string: this
        # parses unittest's own summary line and asserts (1) the test COUNT
        # is unchanged from the established baseline — if it isn't,
        # fail loudly and require investigation rather than silently
        # accepting a different number: (2) zero skips of ANY kind, not just
        # the one previously-known "FastAPI/SQLAlchemy stack not installed"
        # reason - a differently-worded or unrelated skip must also fail
        # this gate; (3) no FAILED/ERROR; (4) an actual standalone "OK" line.
        run: |
          python3 - <<'PYEOF'
          import re
          import sys

          with open("/tmp/test_output.log") as f:
              log = f.read()

          m = re.search(r"Ran (\d+) tests? in", log)
          if not m:
              print("::error::Could not find unittest's 'Ran N tests' summary "
                    "line — the run may have crashed before finishing.")
              sys.exit(1)
          ran = int(m.group(1))

          # 223 at T-1's original writing -> 236 after T-3's refund_payment
          # (2026-09-08) -> 267 after T-5's notifications (2026-09-09,
          # +31 in the new tests.test_notifications_core). NOTE: this value
          # was found STALE at 223 (not 236) when T-5 started, even though
          # T-3 had already raised the real count to 236 the day before —
          # fixed as part of T-5 rather than left for someone else to trip
          # over; see docs/PROJECT_STATE.md's own note about the same
          # per-file drift found in that doc at the same time.
          EXPECTED = 267
          if ran != EXPECTED:
              print(f"::error::Expected exactly {EXPECTED} tests (the established "
                    f"baseline recorded in docs/TASK_BOARD.md) but {ran} ran. "
                    f"Investigate why the count changed — do not just update "
                    f"this number to make CI pass.")
              sys.exit(1)

          tail = "\n".join(log.strip().splitlines()[-8:])

          if re.search(r"skipped=\d+", log):
              print(f"::error::Test run reports one or more skips — zero skips "
                    f"are required once the real dependency stack is installed, "
                    f"a skipped test is not a passed test. Tail of output:\n{tail}")
              sys.exit(1)

          if re.search(r"\b(FAILED|ERROR)\b", tail):
              print(f"::error::Test run reported failures/errors:\n{tail}")
              sys.exit(1)

          if not re.search(r"^OK\s*$", tail, re.MULTILINE):
              print(f"::error::Did not find a clean standalone 'OK' result "
                    f"line. Tail of output:\n{tail}")
              sys.exit(1)

          print(f"PASS — {ran} tests ran (matches the {EXPECTED}-test "
                f"baseline), 0 skips, clean OK.")
          PYEOF

  # ---------------------------------------------------------------------
  # Job 2 — the actual containerized stack: docker compose up, alembic
  # migration, seed data, and a live readiness check. WBS-1.4 / 1.5 / 1.6.
  # ---------------------------------------------------------------------
  docker-compose-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write a CI .env (mock providers — no live Stripe/Vapi/Twilio needed for T-1)
        # Neither SECRET_KEY nor FIELD_ENCRYPTION_KEY is actually enforced by
        # Settings.validate_for_production() in development mode (that
        # validator only fires when APP_ENV=production — confirmed by
        # reading app/core/config.py directly), so the app would boot
        # without these. They're generated anyway to mirror a realistic
        # environment; FIELD_ENCRYPTION_KEY specifically must be a real
        # Fernet key, not an arbitrary string, or passport-encryption code
        # would reject it the moment it's actually used.
        run: |
          SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          python3 -m pip install --quiet cryptography
          FIELD_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          cat > .env <<EOF
          APP_ENV=development
          DATABASE_URL=postgresql+psycopg://charter123:charter123_dev_password@postgres:5432/charter123
          REDIS_URL=redis://redis:6379/0
          SECRET_KEY=${SECRET_KEY}
          FIELD_ENCRYPTION_KEY=${FIELD_KEY}
          BOOTSTRAP_ADMIN_ENABLED=false
          AIRLINE_PROVIDER=mock
          PAYMENT_PROVIDER=mock
          EMAIL_PROVIDER=mock
          SMS_PROVIDER=mock
          FRONTEND_URL=http://localhost:3000
          CORS_ORIGINS=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:8000
          LOG_LEVEL=INFO
          EOF

      - name: docker compose up
        # Compose V2 ("docker compose", not the old hyphenated "docker-compose"
        # v1 binary) is preinstalled on GitHub's ubuntu-latest/ubuntu-24.04
        # runners (confirmed against actions/runner-images' own Ubuntu 24.04
        # readme). docker-compose.yml's postgres/redis already declare
        # healthchecks with `api: depends_on: {postgres,redis}: condition:
        # service_healthy`, so Compose itself won't start the api container
        # until both are actually healthy, not just started.
        run: docker compose up -d --build

      - name: Wait for the api container to report ready
        # /api/v1/health/ready checks DB connectivity via a bare `SELECT 1`
        # (confirmed by reading app/api/routes/health.py) plus a Redis ping —
        # neither requires any table to exist, so this is safe to check
        # BEFORE migrations run: it is only proving the container booted and
        # can reach postgres/redis, not that the schema is correct yet. The
        # real schema-dependent proof is the re-check after alembic+seed below.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/ready | grep -q '"ready"'; then
              echo "API is ready."
              exit 0
            fi
            echo "Waiting for API readiness... ($i/30)"
            sleep 3
          done
          echo "::error::API never became ready."
          docker compose logs api
          exit 1

      - name: Apply migrations (alembic upgrade head)
        # app/db/migrations/env.py overrides alembic.ini's placeholder URL
        # with get_settings().database_url (confirmed by reading env.py
        # directly) so this correctly targets the compose network's
        # postgres service, not the placeholder in alembic.ini.
        run: docker compose exec -T api alembic upgrade head

      - name: Seed reference data
        run: docker compose exec -T api python -m app.db.seed

      - name: Re-check readiness after migrate + seed
        run: curl -fsS http://localhost:8000/api/v1/health/ready | tee /tmp/ready.json | grep -q '"ready"'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
